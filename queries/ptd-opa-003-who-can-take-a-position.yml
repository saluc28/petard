category: Transitive grant through an intermediate object
description: >
  The escalations toward a position worth taking: the principal can write the field that puts them
  there. reach_transitive and reach_direct are the ways of getting in with the relation and without
  it.
query: |-
  MATCH p = (:PTD_Principal)-[e:PTD_CanEscalateTo]->(:PTD_Principal)
  WHERE 'PTD-OPA-003' IN e.patterns
  RETURN p
