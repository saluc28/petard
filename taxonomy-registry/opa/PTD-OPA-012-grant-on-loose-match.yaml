schema_version: 1

id: PTD-OPA-012
name: grant-on-loose-match
title: A decision grants on a value matched more loosely than it is enforced
closes: >
  Matching the value whole, by equality or by its components, so a crafted value cannot slip through, closes it.
  Where the value is canonicalized after the decision, refusing one that is not already canonical does.
engine: opa
status: implemented

category:
  id: LOOSE-ENFORCEMENT-MATCH
  title: Loose enforcement match
  summary: >
    A decision grants on a resource or an action matched more loosely than the enforcement point
    acts on it: a substring, a prefix or suffix, a glob, an unanchored regex. A crafted value
    satisfies the policy's match but resolves to a different resource downstream, so the policy
    approves one thing and the enforcement point does another, the confused deputy.
    Abstract category: it holds for any engine that matches the value it authorizes more loosely
    than the value the enforcement point uses.
  category_note: >
    The first instance. The same category covers the match forms: a substring, an unanchored regex
    and a glob with a wildcard at each end, which let a value embed the written one, and a prefix,
    a suffix, a regex anchored at one end or any other glob, which is often an intended wildcard
    and so is reported as a candidate.

summary: >
  A decision grants when a part of the request matches a value the policy writes, or one it reads
  from the data, with an operator wider than equality, `contains(input.path, "/admin")`. A value
  that merely embeds the written one passes: `/app/.admin-preview` embeds `.admin`, and the router
  serves a resource the policy never meant to allow. The policy approved a path that matched; the
  enforcement point serves the path it resolves to, and the two are not the same.
  In the fixture, a document is served when its id contains the marker `public`, so a private
  document whose id embeds it is served all the same.
  The same gap opens on a prefix when the enforcement point canonicalizes the value after the
  decision: `/do/../admin` starts with `/do/`, and `/admin` is what is served.

preconditions:
  - capability: The principal can send a request whose value embeds the one the policy matches
    note: >
      Naming a resource or an action that satisfies the loose match while resolving, at the
      enforcement point, to one the policy did not mean to allow: a path that embeds the marker, a
      traversal the router collapses.

mechanism:
  description: >
    `contains(input.path, "/admin")` holds for any path with `/admin` anywhere inside it, so
    `/app/.admin-preview` and `/not-admin` pass, though each names a different resource than the
    one the policy meant. `startswith`, `endswith`, `glob.match` and an unanchored `regex.match`
    widen the match the same way; an equality or a match by whole components does not.
  example: |
    package example

    # the decision the router consumes
    default allow_route := false

    allow_route if {
        input.action == "GET"
        contains(input.path, "/public/")
    }
  example_note: >
    The document rule of the fixture has the same shape, and it was measured with the rego package
    of OPA v1.21.1: a request for `handbook/public/intro` is allowed, and a request for
    `public-incident-q3`, a document that is not public, is allowed too, because its id embeds the
    marker.

detection:
  ast_source: compiled
  requires:
    - binding-resolution
    - rule-graph
  requires_note: >
    No enforcement point and no data: the looseness is in the match, which the engine reads off the
    policy, and the shape recognizer says which part of the request is the resource or the action.
    The two are recognized on their own, whether or not the request names who is asking: a router
    that grants on `input.method` and `input.path` reads no subject. Where the request carries them
    under names that say nothing, `-resource` and `-action` declare them, or the declaration of the
    enforcement point does.
    The fourth signal is the exception. It rests on a declaration of the enforcement point, that a
    part of the request is canonicalized after the decision, and it evaluates the decision, so it
    needs the data when the decision reads any. It starts from a request the decision grants,
    built from the policy or given with `-granted`.
  signals:
    - order: 1
      check: >
        A decision reaches a check that holds a part of the request against a value the policy
        writes, or a value it reads from the data, with an operator wider than equality: a substring
        with `contains`, a prefix with `startswith`, a suffix with `endswith`, a glob with
        `glob.match`, or an unanchored regex with `regex.match`. The engine records which form it
        is, and for a glob and a regex the policy writes it reads the form off the pattern: a glob
        with no wildcard is an equality, and a regex that pins both ends in every branch of its
        alternations tests the whole value, so neither is a loose match.
      rationale: >
        Each of these matches a value the policy did not write out: a substring matches it embedded
        anywhere, a prefix or suffix at one end, a glob or an unanchored regex by pattern. An
        equality and a match by whole components match the value and nothing else.
    - order: 2
      check: >
        The decision grants on it, and that part of the request is the resource or the action the
        shape recognizer names, the thing the decision authorizes. A loose match on the side that
        refuses, or on neither the resource nor the action, is left alone.
      rationale: >
        The confused deputy is a grant on more than the value it names. A loose match on the side
        that refuses is a deny that under-blocks, an admission policy validating the object it is
        handed, which is a different concern. A name matched loosely is the question of another
        pattern, PTD-OPA-010, about who controls the name rather than how widely it is matched.
    - order: 3
      check: >
        A substring, a regex with a branch that pins neither end and a glob with a wildcard at
        each end are a finding: the written value embedded anywhere passes, so a crafted value slips
        through. A prefix, a suffix, a regex that pins one end and any other glob are a candidate:
        the looseness is often the intended wildcard, to weigh against what the enforcement point
        does. Against a value read from the data a substring is a finding and every other form a
        candidate.
      rationale: >
        A mid-string match lets a crafted value through whatever the deployment does with it. A
        prefix route can be exactly what was meant, so it is reported as a candidate to check rather
        than a finding.
    - order: 4
      check: >
        The enforcement point declares a part of the request the caller sets as canonicalized after
        the decision, with `canonicalized_after_decision`: dot segments collapsed, percent-encoding
        decoded, or both. Every granting decision that reads that part is asked three requests: one
        it grants, the same one with the part leaving the granted value through dot segments, or
        their encoded form, for a place outside it, and the same one with the part set to that
        place. Granting the second and refusing the third is a finding, and the second request is
        reported with it. A candidate the third signal left on the same decision and the same part
        is dropped. The request it grants is one given with `-granted`, or one built from the
        policy, and a decision with neither is a candidate saying it could not be asked.
      rationale: >
        The decision judged the value as it was written and the enforcement point acts on what it
        resolves to. Asking the decision makes the verdict independent of how the match and the
        guard are written: a prefix the policy writes, one it reads from the data or takes from
        another part of the request, a guard in a function or none at all. A decision that refuses
        the second request is guarded, and one that grants the third grants the place anyway, so
        nothing was bypassed.
  confidence: C
  confidence_note: >
    The claim rests on the shape recognizer naming the resource or the action, so a finding carries
    the level that recognition reached, from a declaration down to a guess about field names. The
    looseness of the match itself is read off the policy and is not a guess. A result of the fourth
    signal rests on the declaration of the enforcement point and carries level A.
  requires_write_model: false
  requires_write_model_note: >
    Nobody writes a document here: the defect is the match, in the policy. It emits no
    `PTD_CanEscalateTo`, since the loose match widens a grant rather than taking the position of
    another principal.

graph:
  emits: finding
  marks:
    - kind: PTD_Rule
      properties: [is_decision]
  marks_note: >
    It marks the rule that holds the loose match, as PTD-OPA-009 and PTD-OPA-010 do, and a rule
    that reads no document has no node otherwise.

false_positives:
  - condition: >
      The loose match is the intended wildcard, a prefix route `/do/**` that the enforcement point
      resolves the same way the policy matches it, with no traversal or encoding to collapse.
    discriminator: >
      Whether a prefix or a glob is intended is not in the policy, so an affix, a regex anchored
      at one end and a glob are reported as candidates rather than findings, and a substring, an
      unanchored regex or a glob with a wildcard at each end, which is wrong whatever the intent,
      as a finding.
  - condition: >
      The enforcement point canonicalizes the value the same way the policy matches it, lower-casing
      before a case-insensitive compare the policy also folds, so the two agree.
    discriminator: >
      How the enforcement point canonicalizes the value is not in the policy. Dot segments and
      percent-encoding collapsed after the decision are declared on the part of the request, and
      the decision is then asked. A case fold, or any other canonicalization, has no declaration
      yet and is left to whoever reads the result.
  - condition: >
      The enforcement point refuses a value that is not canonical before it asks the policy, so the
      request that proves a finding of the fourth signal never reaches the decision. The agent
      router of yashigani does since its fix (`_is_path_traversal`, called at
      `src/yashigani/gateway/agent_router.py:204`, at commit f24fa84a).
    discriminator: >
      That check is in the enforcement point and not in the policy. A part guarded this way is not
      declared canonicalized after the decision: what the policy sees is then what is served.
  - condition: >
      The value matched loosely cannot be crafted: a closed set of resources where no name embeds
      another, enforced somewhere the policy cannot see.
    discriminator: >
      Which values can reach the decision is not in the policy, and a substring match over a closed
      set is still a substring match. Only the system around the policy can say the set is closed.
  - condition: >
      The loose match is on the side that refuses, an admission policy's `violation` that matches the
      object it validates with a glob or a regex, a container image against a digest pattern.
    discriminator: >
      The pattern reports only the grant side. A deny that matches loosely under-blocks, which is a
      different concern from a grant that reaches more than the value it names. On
      open-policy-agent/gatekeeper-library at e4d3bd2, run unit by unit with `violation` declared
      to deny, the engine reads 60 loose matches, thirteen of them on `input.review.object`, a
      suffix on a cpu limit and a regex on an image digest among them, and the pattern reports none:
      each sits in a `violation`, a decision that refuses, and it reports only in one that grants.

not_a_lint_rule: >
  A linter sees `contains(input.path, "/admin")` and `input.path == "/admin"` as a function call
  and a comparison, both well formed. Which one authorizes more than the value it names is the
  difference between a substring and an equality, and whether the loosely matched part is the
  resource the enforcement point serves is in the shape of the request, not in a rule about
  syntax.

fixture:
  bundle: fixtures/vulnerable-bundle/
  scenario: quill
  case: >
    `library.rego`, `allow_doc`: a document is served when its id contains `public`, a substring,
    so a document whose id merely embeds the marker is served too.
  counter_case: >
    The same decision, `"public" in split(input.doc, "/")`: the marker as a whole path component,
    which a document whose id merely embeds it does not match.
  expected: >
    A finding on `input.doc` for `data.quill.library.allow_doc`, and nothing on the match by
    component.

references:
  - title: defenseclaw, F-0543, a substring match on a path
    note: >
      At commit 9bc62550, `policies/rego/admission.rego`: the fix comment at lines 210 to 215
      records the old test `contains(lower(input.path), lower(prefix))`, a substring match that
      "accepted attacker paths whose components merely embedded the marker", `.defenseclaw-evil`
      satisfying a `.defenseclaw` allow for one. The fix matches whole path components
      (`_provenance_prefix_matches` at 221, `_path_components` at 231). The old test folds the case
      and reads the marker from a configuration document, and the pattern reports that form; see
      the notes. Consulted 2026-10-11.
  - title: yashigani, LAURA-OPA-001, a match before canonicalization
    note: >
      At commit f24fa84a, `helm/yashigani/files/policy/agents.rego`: `_agent_path_matches` (line 108)
      matches a `/do/**` pattern with `startswith(path, concat("", [prefix, "/"]))` (line 113). The
      close-out added `_agent_path_safe` (line 95), which rejects `../`, `..\`, a trailing `/..`, and
      the URL-encoded forms, before the match. Without it `/do/../admin` prefix-matches `/do/` but
      the downstream collapses it to `/admin`: the router sends the path to the policy as
      `remainder_path` (`src/yashigani/gateway/agent_router.py:378`) and appends it to the upstream
      URL it hands to httpx (line 486), which its own comment says collapses dot segments (line
      73). The fourth signal reads this shape with the path declared canonicalized after the
      decision; see `verified`. Consulted 2026-10-12.

verified:
  date: 2026-10-12
  tool_version: opa 1.21.1
  how: >
    The engine finds the case and stays quiet about the counter case on the fixture. The checks on
    the request list `contains(input.doc, "public")` as granting in `data.quill.library.allow_doc`,
    read as a substring. `"public" in split(input.doc, "/")` is a membership over a value the
    policy computes and is not among them. The shape recognizer names `input.doc` the resource at
    level D, from its field name, so the substring is a finding at that level.
    The numbers behind it, `data.quill.verify.loose_match`, measured with the rego package of OPA
    v1.21.1: a request for `handbook/public/intro`, where the marker is a whole component, is
    allowed, a request for `public-incident-q3`, which embeds the marker, is allowed too, and a
    request for `secret-report` is refused.
    `regal` v0.42.0 reports no violations on `policy-v1`.
    On generated worlds the verdict rests on the policy and not on the data: the same substring is a
    finding and the same prefix a candidate, whatever the dataset.
    The fourth signal was measured on yashigani at f24fa84a, on the seven Rego files at the top of
    `helm/yashigani/files/policy`, with a declaration that asks for `agent_call_allowed` and marks
    `input.request.remainder_path` canonicalized after the decision, for dot segments and for
    percent-encoding. On the policy as it stands it reports nothing. With the call to
    `_agent_path_safe` taken out of `_path_allowed` (`agents.rego:88`) it reports a finding, proven
    by a request for `/petard-root/petard-leaf/../../petard-beyond` to an agent that accepts
    `/petard-root/petard-leaf`: granted, and refused once the path is `/petard-beyond`.

related:
  - id: PTD-OPA-010
    note: >
      The other pattern that reads how a part of the request is matched. 010 is about who controls a
      name an issuer hands over; this is about a match wider than the value the enforcement point
      uses. A loose match on a name an issuer sets is 010's, on a resource or an action is this one.
  - id: PTD-OPA-009
    note: >
      The same reading of the loose-match builtins serves 009: an exemption lifted by
      `not startswith(input.kind, "exempt-")` is a check on the request like one lifted by `==` or
      `in`.

notes:
  - >
    A case-folded match, `contains(lower(input.path), "/admin")`, is read as the same match on the
    same part of the request: `lower` and `upper` hand back the value they are given. The real
    defenseclaw instance folds the case this way.
  - >
    A loose match against a value read from the data, `contains(input.path, data.markers[_])`, is
    reported with the path of that value: a substring as a finding, and a prefix, a suffix, a glob
    or a regex as a candidate, since the pattern of the last two is then in the document. The
    marker can be read where it is matched or out of a record a function is handed. The real
    defenseclaw instance reads its markers this way, from the entries of an allow list. Known
    false negative: a match against a value the policy computes from the data, or against another
    part of the request, whose form the engine does not read. Where that part is declared
    canonicalized after the decision the fourth signal asks the decision instead.
  - >
    The fourth signal needs a request the decision grants. The ones given with `-granted` come
    first. It then builds one from the conditions partial evaluation leaves once the part is set:
    to a path of its own, to one under each value the decision matches the part against, and to
    each value the policy holds it against whole. Where none of those is granted it leaves the
    part open with the rest of the request, and takes the values the conditions hold it to, the
    paths a document lists among them. A decision that holds the path against a component at a
    fixed place, `split(input.path, "/")[1] == "public"`, leaves no condition to build from, though
    a path climbing out of `/public/` satisfies it too: it is a candidate saying it could not be
    asked, and given a request it grants it is asked like any other. Known false negatives: a
    way of granting that none of the requests asked about takes, in a decision another way of
    which gave one; and a canonicalization other than dot segments and percent-encoding, a second
    decoding or a case fold.
  - >
    A regex is read with the syntax OPA compiles it with. `^/public|/health$` pins one end in each
    branch and both in neither, so it is a candidate; `^.*admin.*$` pins both ends and opens them
    again, so it is a finding; under `(?m)` the two anchors match at every line of the value and
    pin nothing.
  - >
    A match by whole components, `"admin" in split(input.path, "/")`, is a membership over a value
    the policy computes, not a loose match, and is not reported: it is one of the shapes that closes
    the pattern.
