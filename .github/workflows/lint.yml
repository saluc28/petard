name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout 5m

  # A release configuration is otherwise only exercised by a tag, and a tag
  # that fails leaves a version number spent with no release behind it.
  release-config:
    name: Release config
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true

      - name: goreleaser check
        run: goreleaser check
