# The WrittenBy model of the Quill fixture.
#
# It is the one part of the fixture that is NOT derivable from the policy: it
# describes the system around OPA. Here it is declared by hand, the way it will
# have to be in the general case.
schema_version: 1
model: write-paths

entries:
  # ---------------------------------------------------------------------
  # THE PTD-OPA-001 CASE, and the root of the chain towards 003.
  # The subject writes their own department from the self-service form.
  - path: data.users.{owner}.profile.department
    writable_by:
      - principal: "{owner}"
        via: "PATCH /api/v1/me/profile"
        note: >
          A field exposed in the profile form. No validation against a closed
          list of departments, and no approval step.
        confidence: asserted

  # The rest of the profile is just as writable, but no decision reads it: it
  # is here to prove the engine does not report write paths nobody reads.
  - path: data.users.{owner}.profile.*
    writable_by:
      - principal: "{owner}"
        via: "PATCH /api/v1/me/profile"
        confidence: asserted

  # ---------------------------------------------------------------------
  # THE PTD-OPA-001 COUNTER CASE, and the write of the PTD-OPA-006 case.
  # Same record, a field a decision reads, but written by a role rather than
  # by the subject as such. Signal 2 of 001 fires, signal 3 does not: no
  # finding. An administrator who can elevate anybody is the expected
  # behaviour; support staff who can make themselves editor is 006.
  - path: data.users.{owner}.roles
    writable_by:
      - principal: role:admin
        via: "PUT /api/v1/users/{id}/roles"
        note: Any role.
        confidence: asserted
      - principal: role:support
        via: "PUT /api/v1/users/{id}/roles"
        note: >
          Viewer and editor only, for anybody, themselves included. Which
          values may be written is decided by data.quill.admin.allow, the
          decision the PEP of this endpoint consumes.
        confidence: asserted
        authorized_by:
          decision: data.quill.admin.allow
          value: input.role

  # ---------------------------------------------------------------------
  # Explicit project membership: written by the project owner, not by the
  # subject of the decision. It is the LEGITIMATE route to the same position
  # the 001 -> 003 chain reaches by writing a profile field.
  #
  # is_member searches this list for the requester, so the entry is also what
  # keeps that search quiet: declaring the element instead, members.{member}
  # writable by {member}, would say anybody can join, and 001 would report it.
  - path: data.projects.{project}.members
    writable_by:
      - principal: "owner_of:{project}"
        via: "POST /api/v1/projects/{project}/members"
        confidence: asserted

  # ---------------------------------------------------------------------
  # Written by a system, not by a user. Relevant to PTD-OPA-002: whoever can
  # make this path ABSENT turns the MFA check off. Being able to delete a field
  # is a different capability from being able to write one, and the format has
  # no way to declare it yet.
  - path: data.tenants.{tenant}.policy.require_mfa
    writable_by:
      - principal: system:provisioning
        via: "tenant onboarding job"
        note: >
          The dolm tenant was created before the field existed, and the job was
          never re-run against it. That is where the PTD-OPA-002 fail-open
          comes from, and it is a fact about the data rather than about the
          policy.
        confidence: asserted

  # ---------------------------------------------------------------------
  # THE PTD-OPA-008 CASE, and its counter case. The platform settings are one
  # document every request shares, synced from a configuration repository:
  # whoever gets a change merged there writes both switches. Only the reading
  # room decides for somebody the data does not know, and that is the finding.
  - path: data.settings.*
    writable_by:
      - principal: system:config-sync
        via: "configuration repository, synced on merge"
        note: Whatever is merged into the configuration repository.
        confidence: asserted

  # ---------------------------------------------------------------------
  # THE PTD-OPA-010 CASE. Not a document: a part of the request, which the
  # single sign-on fills in with the names of the user's groups. Whoever can
  # create a group, or rename one, can make it say any name, so the entry
  # says who can do that. No read of data matches a path into input, so the
  # entry adds no writer to a document and does not count towards coverage.
  - path: input.groups[_]
    writable_by:
      - principal: role:viewer
        via: "POST /api/v1/groups"
        note: >
          Any account can create a group, a viewer included, and whoever
          creates one names it and is its first member.
        confidence: asserted

# ---------------------------------------------------------------------------
# Paths deliberately NOT declared, to keep the world closed.
# What is not declared is not writable, so an incomplete model produces false
# negatives rather than false positives.
#
#   data.projects.{project}.department   <- writable by the subject, this would
#                                           be a second route into the chain
#   data.projects.{project}.parent       <- restructuring the hierarchy is a
#                                           different capability, and probably
#                                           a pattern of its own
#   data.documents.*                     <- no decision in the fixture reads a
#                                           field of it to grant
