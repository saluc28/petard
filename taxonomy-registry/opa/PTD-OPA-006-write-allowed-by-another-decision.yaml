schema_version: 1

id: PTD-OPA-006
name: write-allowed-by-another-decision
title: One decision lets a principal write the data another decision grants on
engine: opa
status: verified

category:
  id: SPLIT-GRANT
  title: A grant split across two decisions
  summary: >
    One decision governs who may change a piece of authorization data, and another decision
    grants on that data. Each is reasonable on its own, and what they grant together appears in
    neither. It is the shape of the methods Rhino Security Labs catalogued for AWS, where
    `iam:PassRole` and `ec2:RunInstances` together hand somebody a role neither gives alone.
    Abstract category: it holds wherever the authority to change what a policy reads is itself
    decided by a policy.

summary: >
  A decision in the bundle lets a principal write a value into a document that a second decision
  reads to grant. The principal does not hold that grant today; after a write the first decision
  allows, they do.
  In the fixture, support staff may assign the roles viewer and editor to anybody, themselves
  included, and editors may publish. `carol` holds support, cannot publish, and can make herself
  an editor.
  The finding is not that either decision is wrong. It is that nobody reads them together.

preconditions:
  - capability: The principal holds what the first decision requires to allow the write
    note: >
      In the fixture, the role `support`. Nothing else: no administrator, no second account.
  - capability: The first decision allows writing a value the second decision grants on
    note: >
      Into a document the second decision reads for that principal: their own record, when the
      assignment is allowed for anybody, themselves included.
  - capability: The endpoint that performs the write consumes the first decision
    note: >
      Both decisions are served by the same bundle, or by bundles analyzed together. A write
      authorized outside OPA is the territory of the write model alone.

mechanism:
  description: >
    Rego has no notion of a write. A decision about an assignment endpoint and a decision about
    publishing are two unrelated rules that happen to read and govern the same document, and
    nothing in either file points at the other: the link is in the system around OPA, where one
    PEP asks the first decision before writing and another asks the second before granting.
  example: |
    package quill

    # the decision the PEP of PUT /api/v1/users/{id}/roles consumes
    default allow_assign := false

    allow_assign if {
        input.action == "assign_role"
        "support" in data.users[input.user].roles
        input.role in {"viewer", "editor"}
    }

    # the decision the PEP of POST /api/v1/documents/{id}/publish consumes
    default allow_publish := false

    allow_publish if {
        input.action == "publish"
        "editor" in data.users[input.user].roles
    }
  example_note: >
    Both rules compile without a warning and each does exactly what it says. With
    `data.users.carol.roles` as ["support"], carol is allowed to assign editor and is not allowed
    to publish; with ["support", "editor"] she publishes.
    The example keeps both decisions in one package so that it fits one module. In the fixture
    they are two packages, which is the realistic form: two files, written and reviewed apart.

detection:
  ast_source: compiled
  requires:
    - binding-resolution
    - rule-graph
    - concrete-data
  signals:
    - order: 1
      check: >
        A decision reads a path in `data` whose index derives from the subject, in granting
        position: the first two signals of `PTD-OPA-001`, with the side added, for the reason the
        notes give. A decision that searches a collection for the subject by value counts too,
        and then the collection is what a write adds to.
      rationale: >
        The read is where the grant depends on a document, and it is the same read 001 starts
        from. What differs is who the write model says writes it.
        The two forms are the same fact reached from different ends. A field of the subject's own
        record is written by putting a value in it, and a membership is written by adding the
        subject to a list, so the search form fixes the value and varies the document while the
        other fixes the document and varies the value.
    - order: 2
      check: >
        The write model covers that path with a writer that is not a capture of the path, and
        names the decision of the bundle that the writing endpoint consumes.
      rationale: >
        A role or a system writing a field is what 001 deliberately leaves alone. What this
        pattern adds is that the rules deciding what that role may write are in the bundle, and
        can be asked. The writer names that decision in its `authorized_by`, by its data path, the
        way a PEP names the decision it queries, and names the fields the decision reads the
        written value and the target from, since the decision speaks of input and the model of
        data paths.
    - order: 3
      check: >
        Partially evaluate the granting decision for each principal with that principal's
        document left unknown, and collect the constant values the residual conditions compare
        the document against. In the search form there is nothing to collect: the value added is
        the subject, and the documents of the collection are what the principal is asked about.
      rationale: >
        These are the values that would grant, taken from OPA's answer rather than from reading
        the policy: on the fixture, "editor" for publish and "admin" for withdraw. Collecting the
        constants of a residual is structural; it does not interpret what the condition means.
    - order: 4
      check: >
        Ask the first decision, for the same principal, whether writing each of those values into
        their document is allowed, or, in the search form, whether adding an element to that
        collection is. The request carries the parts the writing endpoint fills in itself, which
        the write model declares.
      rationale: >
        This is what separates the case from the counter case: support may write editor and may
        not write admin, so the withdraw branch is never reached. Without this signal the pattern
        would report every branch that reads a field somebody can write.
        The parts the endpoint fills in are what keeps the question about a write. Asked without
        them, it becomes "may this principal make some request about that resource", and anybody
        allowed to read it answers yes.
    - order: 5
      check: >
        Evaluate the granting decision again with the document holding an allowed value, or with
        the principal among the elements of the collection, and report the principals it grants
        more to than it did before.
      rationale: >
        The whole decision is evaluated, not the branch, so any other condition the decision
        imposes still applies. On the value side a principal who already held the grant is not
        reported, since for them the write changes nothing; on the search side what is compared
        is how many ways the decision has of granting, before and after, and a principal already
        in the collection is left alone because there is no join to make.
  confidence: C
  confidence_note: >
    As for `PTD-OPA-001`, the claim rests on the recognition of the subject, which on the fixture
    is D, a guess on field names. The link between the endpoint and the first decision is
    declared in the write model, which makes it asserted rather than inferred.
  requires_write_model: true
  requires_write_model_note: >
    The pattern cannot run without it: nothing in either decision says that one governs a write
    the other depends on.

graph:
  emits: finding
  emits_note: >
    A finding once the write model names the decision behind the write, since at that point every
    step is an answer OPA gave. Without the model, the reads of signal 1 are what 001 already
    reports as candidates, and this pattern adds nothing to them.
  marks:
    - kind: PTD_CanEscalateTo
      properties: [decision, authorized_by, value, via_write_path, via, confidence]
  marks_note: >
    The pattern marks the escalation it draws: `via_write_path` is the entry of the write model
    the write goes through, `authorized_by` the decision the writing endpoint consumes, `value`
    the value written, and `decision` the decision that grants after the write.
  edge: PTD_CanEscalateTo
  from: PTD_Principal
  to: PTD_Principal
  traversable: true
  traversable_note: >
    Traversable for the same reason as the escalation of the 001 to 003 chain: the principal can
    take the position, through a write the bundle allows. The target is a principal who holds the
    granting value today; on the fixture, `alice`, the editor.

false_positives:
  - condition: >
      The first decision allows the write, but the system around OPA adds a step it does not
      show: an approval, a ticket, a second person.
    discriminator: >
      Declared in the note of the writer in the write model, as for any other write path. The
      finding stays, with the step next to it, because an approval nobody audits is still the only
      thing between the principal and the grant.
    measurement: out-of-band
  - condition: >
      The first decision refuses to let a principal assign the role to themselves.
    discriminator: >
      Signal 4 answers no by itself, provided the write model names the input field that holds
      the target in `authorized_by.target`: the engine then asks the decision about a write to
      the principal's own document. Two principals holding the first capability can still
      assign each other, which is the collusion the notes declare.
    measurement: case
    case:
      policy: |
        package roles_case

        # METADATA
        # scope: document
        # title: Role assignment decision, never to oneself
        # entrypoint: true
        default assign := false

        assign if {
            input.action == "assign_role"
            "support" in data.users[input.user].roles
            input.role in {"viewer", "editor"}
            input.target != input.user
        }

        # METADATA
        # scope: document
        # title: Publishing decision
        # entrypoint: true
        default publish := false

        publish if {
            input.action == "publish"
            "editor" in data.users[input.user].roles
        }
      data: |
        {
          "users": {
            "carol": {"roles": ["support"], "department": "support"},
            "alice": {"roles": ["editor"], "department": "press"}
          }
        }
      write_model: |
        schema_version: 1
        model: write-paths
        entries:
          - path: data.users.{owner}.roles
            writable_by:
              - principal: role:support
                via: "PUT /api/v1/users/{id}/roles"
                authorized_by:
                  decision: data.roles_case.assign
                  value: input.role
                  target: input.target
      reports: false
      note: >
        Run with opa 1.20.2: `carol` may assign `editor` to `alice` and not to herself. The engine
        asks `assign` about a write to carol's own document and stays quiet. The same case with
        `target` left out of `authorized_by` is reported, because the target is then left open
        and some other principal satisfies the decision, which is why the field is there.
  - condition: >
      The first decision allows assigning the role to anybody, and only the endpoint refuses to
      let a principal assign it to themselves.
    discriminator: >
      The check lives outside the bundle, so the declaration belongs in the note of the writer in
      the write model, and the finding stays with it.
    measurement: out-of-band
  - condition: >
      The combination is intended: support staff are meant to be able to publish.
    discriminator: >
      Intent is in no dataset. A list of known delegations, versioned next to the write model,
      keeps them in the report and out of the noise.
    measurement: out-of-band
  - condition: >
      The granting decision also depends on other data the principal does not control, such as a
      tenant or a classification.
    discriminator: >
      Signal 5 evaluates the whole decision with the written value, so a condition that still
      does not hold leaves the principal unreported.
    measurement: case
    case:
      policy: |
        package roles_case

        # METADATA
        # scope: document
        # title: Role assignment decision
        # entrypoint: true
        default assign := false

        assign if {
            input.action == "assign_role"
            "support" in data.users[input.user].roles
            input.role in {"viewer", "editor"}
        }

        # METADATA
        # scope: document
        # title: Publishing decision, for the press office
        # entrypoint: true
        default publish := false

        publish if {
            input.action == "publish"
            "editor" in data.users[input.user].roles
            data.users[input.user].department == "press"
        }
      data: |
        {
          "users": {
            "carol": {"roles": ["support"], "department": "support"},
            "alice": {"roles": ["editor"], "department": "press"}
          }
        }
      write_model: |
        schema_version: 1
        model: write-paths
        entries:
          - path: data.users.{owner}.roles
            writable_by:
              - principal: role:support
                via: "PUT /api/v1/users/{id}/roles"
                authorized_by:
                  decision: data.roles_case.assign
                  value: input.role
                  target: input.target
      reports: false
      note: >
        Run with opa 1.20.2: `alice` publishes, and `carol` with `editor` written into her roles
        still does not, because she is not in the press office. The engine writes the value,
        evaluates the whole decision, and stays quiet. Without the department condition the same
        case reports carol reaching the position of alice.
  - condition: >
      In the search form, the principal already holds everything the collection grants, so
      joining it adds a way of granting and no access. An administrator who may add anybody to
      any policy is reported for every policy they are not in.
    discriminator: >
      What signal 5 compares is how many ways the decision has of granting that principal, and a
      redundant way counts like any other. Telling one apart means deciding whether a residual
      condition the principal already satisfies implies the new one, which is a question for a
      solver rather than for an evaluator: OPA answers what holds, not what one condition entails
      about another.
    measurement: case
    case:
      policy: |
        package authz

        # METADATA
        # scope: document
        # title: Projects the subjects of the request are authorized on
        # entrypoint: true
        authorized_project contains project if {
            has_member[policy]
            project := data.policies[policy].projects[_]
            project == input.projects[_]
        }

        # METADATA
        # scope: document
        # title: Decision the endpoint that adds a member consumes
        # entrypoint: true
        default allow_write := false

        allow_write if {
            input.action == "iam:policyMembers:create"
            has_member["administrators"]
        }

        has_member contains policy if {
            member := data.policies[policy].members[_]
            subject := input.subjects[_]
            subject == member
        }
      data: |
        {
          "policies": {
            "administrators": {"members": ["user:root"], "projects": ["project-a", "project-b"]},
            "readers": {"members": ["user:alice"], "projects": ["project-a"]}
          }
        }
      write_model: |
        schema_version: 1
        model: write-paths
        entries:
          - path: data.policies.{policy}.members.{member}
            writable_by:
              - principal: role:member-editor
                via: "POST /apis/iam/v2/policies/{policy}/members:add"
                authorized_by:
                  decision: data.authz.allow_write
                  request:
                    input.action: "iam:policyMembers:create"
      reports: true
      note: >
        Run with opa 1.20.2. Only the administrators may add members, and `user:root` is the only
        one of them, so the engine asks about that one principal and reports the join to
        `readers`: two ways of granting before, three after. The access does not change, since
        `project-a` is already theirs through `administrators`, and the count is what the engine
        can see. `user:alice` is reported for nothing, which is the other half of the case: the
        decision behind the endpoint refuses her the write.

not_a_lint_rule: >
  Each file is correct and idiomatic on its own, and a linter reads one file at a time. The defect
  is in the composition of two decisions through a document neither of them owns, and in a fact
  found only in the system around OPA: that one of them governs the write the other depends on.

fixture:
  bundle: fixtures/vulnerable-bundle/
  scenario: quill
  case: >
    `admin.rego` lets support staff assign viewer and editor to anybody, themselves included.
    `publish.rego` lets editors publish. `carol` holds support.
  expected_edge: >
    PTD_CanEscalateTo from carol to alice, the principal who holds editor, through
    data.users.{owner}.roles, authorized by data.quill.admin.allow, for data.quill.publish.allow.
  expected_note: >
    The counter case is the withdraw branch of the same decision, which grants on admin: the
    assignment decision does not let support write admin, so no allowed write reaches it.

references:
  - title: Rhino Security Labs, AWS IAM privilege escalation methods
    note: >
      RhinoSecurityLabs/AWS-IAM-Privilege-Escalation, README.md at commit
      9ea10d3b31255a3a989b1a5cf2fade2fd29ea466, checked on 2026-09-14. Method 3, "Creating an EC2
      instance with an existing instance profile", needs `iam:PassRole` and `ec2:RunInstances`
      together. A framing reference: the same shape, two grants that do not escalate apart.
  - title: regal, rule categories
    note: Checked on 2026-08-01 and again at the source of v0.42.0, no `security` category.

verified:
  date: 2026-09-17
  tool_version: opa 1.20.2
  how: >
    The engine finds the case and stays quiet about the counter case on the fixture. It leaves
    carol's `roles` unknown and reads off the values the publishing decision would grant on,
    "editor" and "admin"; asks the assignment decision which of them carol may write, and gets
    editor and not admin; evaluates publishing again with editor written in, and carol grants where
    she did not before. The one `PTD_CanEscalateTo` it emits runs from carol to alice, who holds
    editor, through `data.users.{owner}.roles`, authorized by `data.quill.admin.allow`, for
    `data.quill.publish.allow`. The withdraw branch, which grants on admin, opens nothing, because
    the assignment decision does not let support write admin.
    The numbers behind it, measured with `data.quill.verify.split_grant`: carol does not publish as
    the data stands; the assignment decision allows her editor and not admin; with roles
    ["support", "editor"] she publishes and still cannot withdraw.
    The fixture holds two `PTD_CanEscalateTo`, this one and the 001 to 003 chain, with the write
    model covering 4 of 9 paths. `PTD-OPA-001` reports nothing on `roles`, which a role writes and
    the subject does not.
    regal v0.42.0 reports no violations on `policy-v1`.
    On generated worlds, which give everybody the viewer role, the engine reports no split grant
    for anybody.
    The search form is measured on a bundle shaped like Chef Automate, where the request carries a
    list of subjects and a policy applies to whoever it holds among its members. The principal who
    may manage the members of a policy adds themselves to the one that grants everything, and the
    engine reports it; the principal who may only read is asked the same question and comes out
    with nothing, because the decision behind the endpoint refuses them the write. Taking the
    parts the endpoint fills in out of the write model reports that reader as a writer, which is
    what those parts are for, and a test holds that too.
    The six declared false positives are settled as the status requires. Three are
    `out-of-band`: an approval outside OPA, a refusal of self-assignment that only the endpoint
    makes, and a combination that is meant. The other three carry a case with its own data and
    write model that runs on every build. The engine stays quiet on two of them, a decision that
    refuses self-assignment and a granting decision with a condition the write does not meet, and
    reports the third, an administrator joining a policy that grants them nothing they did not
    already have.

related:
  - id: PTD-OPA-001
    note: >
      The boundary. 001 is the subject writing their own field, declared as a capture of the
      path. 006 is a role writing the field for anybody, the subject included, with the decision
      that allows it in the bundle. The same read can be the start of either.
  - id: PTD-OPA-003
    note: >
      Could chain as 001 does: a write the first decision allows could open a position in a
      hierarchy rather than a flat grant. Not in the fixture.

notes:
  - >
    How the write model names the decision an endpoint consumes is settled: the writer's
    `authorized_by` names it by its data path, `data.quill.admin.allow`, the way every PEP
    configures the decision it queries (opa.authorizer.url ending /v1/data/kafka/authz/allow,
    POLICY_PATH /v1/data/httpapi/authz, authz_endpoint /v1/data/sshd/authz, in
    open-policy-agent/contrib at 90f7ca9), and names the input fields the decision reads the
    written value and the target from, since a decision speaks of input while the write model
    speaks of data paths. The target is optional, since a decision that never reads who a write is
    aimed at needs none, and it is set to the subject for a write to one's own record.
    The value is optional for the same kind of reason, and an endpoint that adds a member shows
    why: what it asks about is the collection, and who is being added is not in the request at
    all. What such an endpoint does send is declared in `request`, a map from the input path to
    what it fills in, with the captures of the path available to it. That is how the endpoints of
    the world describe themselves: Chef Automate annotates AddPolicyMembers with the action
    `iam:policyMembers:create` and the resource `iam:policies:{id}:members`
    (api/external/iam/v2/policy.proto:373 at 61ca031), and its gateway sends those two to the
    decision.
  - >
    A decision that collects is asked for what it holds. `data.authz.authorized_project` builds a
    set of projects, and an empty set is a defined value, so in Rego the query naming it holds
    while the decision grants nothing: asked that way, a principal authorized on no project at
    all would read as one the decision cannot refuse. Which it is comes from the rule, since a
    rule with a key in its head builds a set or an object, and the elements are then what the
    question asks for, exactly as Chef Automate's own enforcement point does
    (data.authz.authorized_project[project], components/authz-service/engine/opa/opa.go:36 at
    61ca031). A complete rule whose value happens to be a set is asked as a value, and an empty
    answer from it still reads as a grant; that is a false positive nothing here tells apart.
  - >
    Known false negative: the constants of signal 3 are the values that grant only for a
    comparison with a literal. A decision that grants on a value computed from other data leaves
    nothing to collect, and the pattern stays silent there rather than guess the value, which
    would cost the precision the whole approach rests on.
  - >
    Known false negative: the engine measures the write to the principal's own document, one
    account acting alone. When the first decision forbids assigning to oneself, two accounts that
    both hold the capability can still assign each other, and that collusion of two is left
    unreported. It is a different shape, closer to a collusion pattern than to this one, and
    folding it in would lower the confidence of the single account finding that is the point here.
  - >
    Known false negative: a write that lifts a denial. The registry does not treat the side of a
    decision as a reason to stay quiet about a value somebody controls, and this pattern stays on
    the side that grants only because of how it measures: signal 3 writes the values a decision
    compares with, and on the side that denies those are the values that deny. Lifting a denial
    means writing some other value, which the pattern has no way to name. A decision declared to
    deny is left out for the same reason, on either side: every value it compares with is one
    that makes it refuse.
