# The gateway in front of Quill, declared the way pep-registry declares a
# product.
#
# Like the write model, it describes the system around OPA rather than the
# policy, and it is written by hand: Quill is the application the fixture is
# written for, and nothing here was read from a product. It is what tells a part
# of the request the caller chooses from one the gateway sets. It names no
# subject, so the subject of the fixture stays the one the engine recognizes.
schema_version: 1
id: quill-gateway
title: The gateway in front of Quill
engine: opa

source:
  kind: documentation
  note: The fixture's own gateway, declared in fixtures/vulnerable-bundle/EXPECTED.md.

decisions:
  - rule: allow
    side: grants
  - rule: allow_reading_room
    side: grants
  - rule: allow_console
    side: grants
  - rule: allow_unguarded
    side: grants
  - rule: allow_guarded
    side: grants
  - rule: allow_vulnerable
    side: grants
  - rule: allow_defensive
    side: grants
  - rule: allow_positive_side
    side: grants
  - rule: allow_default_option
    side: grants
  - rule: allow_export
    side: grants
  - rule: allow_audit_log
    side: grants
  - rule: allow_sync
    side: grants
  - rule: allow_mint
    side: grants
  - rule: allow_mint_narrowed
    side: grants

fields:
  - path: input.user
    set_by: issuer
    issuer: the single sign-on of Quill
    evidence:
      - "fixtures/vulnerable-bundle/EXPECTED.md, section 3, PTD-OPA-009"
  # THE PTD-OPA-009 COUNTER CASE. The gateway reads it off the session: true
  # when the session was opened with a second factor.
  - path: input.mfa
    set_by: enforcement-point
    note: Whether the session was opened with a second factor.
    evidence:
      - "fixtures/vulnerable-bundle/EXPECTED.md, section 3, PTD-OPA-009"
  - path: input.tenant
    set_by: enforcement-point
    note: The tenant of the session.
    evidence:
      - "fixtures/vulnerable-bundle/EXPECTED.md, section 3, PTD-OPA-009"
  - path: input.reviews
    set_by: enforcement-point
    note: The reviews of the change, as the review service keeps them.
    evidence:
      - "fixtures/vulnerable-bundle/EXPECTED.md, section 3, PTD-OPA-009"
  # THE PTD-OPA-010 CASE. The single sign-on copies the names of the groups the
  # user belongs to, and a name is whatever whoever created the group typed.
  - path: input.groups.*
    set_by: issuer
    issuer: the single sign-on of Quill
    identifier: name
    note: The names of the groups of the user, from the directory of Quill.
    evidence:
      - "fixtures/vulnerable-bundle/EXPECTED.md, section 3, PTD-OPA-010"
  # THE PTD-OPA-010 COUNTER CASE. The same groups, by the id the directory
  # assigns when a group is created.
  - path: input.group_ids.*
    set_by: issuer
    issuer: the single sign-on of Quill
    identifier: id
    note: The ids of the groups of the user, which the directory assigns and never reuses.
    evidence:
      - "fixtures/vulnerable-bundle/EXPECTED.md, section 3, PTD-OPA-010"
  # THE PTD-OPA-011 CASE. The mesh proves the SPIFFE identity of the calling
  # workload from its mTLS certificate, so the caller cannot write it. Who can
  # BECOME that service account is a question about who can deploy into the
  # namespace, which lives in another layer.
  - path: input.caller.spiffe
    set_by: enforcement-point
    identity: true
    assumable_by:
      - principal: role:deployer
        via: deploy a workload under the service account in ns/platform
    note: The SPIFFE identity of the calling workload, from its mTLS certificate.
    evidence:
      - "fixtures/vulnerable-bundle/EXPECTED.md, section 3, PTD-OPA-011"
  # THE PTD-OPA-011 COUNTER CASE. The same kind of identity, which the mesh binds
  # to a verified credential: no deploy makes somebody it.
  - path: input.caller.attested
    set_by: enforcement-point
    identity: true
    pinned: true
    note: An agent identity the mesh binds to a verified credential.
    evidence:
      - "fixtures/vulnerable-bundle/EXPECTED.md, section 3, PTD-OPA-011"
  # THE PTD-OPA-013 CASE. The agent asks for scopes, and the mint decision bounds
  # them by the agent's own role but not by the delegating edge. What the agent
  # may ask for has to sit inside what the delegator holds, and that bound is not
  # in the policy: the gateway declares the requested authority and its ceilings.
  - path: input.requested_scopes
    set_by: caller
    authority: requested
    bounded_by:
      - input.delegation_edge.scopes
      - input.role_scopes
    note: The scopes the delegated agent asks to mint.
    evidence:
      - "fixtures/vulnerable-bundle/EXPECTED.md, section 3, PTD-OPA-013"
  # The delegating user's edge: the scopes the delegator carries, which the STS
  # proves. The requested authority must sit inside it.
  - path: input.delegation_edge.scopes
    set_by: issuer
    issuer: the delegation edge the STS proves
    authority: ceiling
    note: The scopes the delegating user's edge carries.
    evidence:
      - "fixtures/vulnerable-bundle/EXPECTED.md, section 3, PTD-OPA-013"
  # The agent's own role grant. Bounding the request by this is sound, but a role
  # grant is not the delegator's authority.
  - path: input.role_scopes
    set_by: issuer
    issuer: the role service
    authority: ceiling
    note: The scopes the agent's own role grants.
    evidence:
      - "fixtures/vulnerable-bundle/EXPECTED.md, section 3, PTD-OPA-013"
  # THE PTD-OPA-009 CASE falls here: input.scheduled is in the body of the
  # request, with what the caller asks for.
  - path: input.*
    set_by: caller
    note: What the caller asks for, action, doc and role, and anything else the body carries.
    evidence:
      - "fixtures/vulnerable-bundle/EXPECTED.md, section 3, PTD-OPA-009"
