name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum declared in go.mod has to be tested: it is the version
        # that decides whether the compatibility claim is true. It is not a
        # choice, it is OPA's own floor, and it moves when OPA moves.
        # stable is what most people will actually be on.
        go: ["1.26", "stable"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      # A go.mod or go.sum that tidy would change is a dependency somebody added
      # without recording it, and the next person to run tidy gets it in a diff
      # that has nothing to do with their change.
      - name: Check the module files are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # Formatting is not checked here. gofmt's output changes between Go
      # releases, so the same file can be formatted for one version of the
      # matrix and unformatted for another, and the check fails on a file
      # nobody can write correctly. The Lint workflow runs it once, on one
      # version.
      - name: Build
        run: go build ./...

      # -race catches data races, -shuffle=on catches tests that only pass in
      # the order they were written.
      - name: Test
        run: go test -race -shuffle=on -coverprofile=coverage.out ./...

      - name: Coverage summary
        if: matrix.go == 'stable'
        run: go tool cover -func=coverage.out | tail -n 1
