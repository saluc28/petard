category: Global switch
description: >
  The permissions a coalition raises by writing a relation to the wildcard subject, which grants
  it to every object of a type at once, the coalition among them.
query: |-
  MATCH p = (:PTD_Principal)-[e:PTD_CanEscalateTo]->(:PTD_Resource)
  WHERE 'PTD-ZAN-003' IN e.patterns
  RETURN p
