name: "PTD-OPA-002: who writes what the check does not cover"
guid: 523ce455-95d4-4509-aa83-c46693c6c4fe
prebuilt: false
platforms:
  - Open Policy Agent
category: Fail-open on absence
description: >
  Whoever the write model says can write the document the check is silent about. A check that
  does not apply is worth as much as the control over that document.
query: |-
  MATCH p = (:PTD_Rule)-[e:PTD_Reads]->(:PTD_Attribute)-[:PTD_WrittenBy]->(:PTD_Principal)
  WHERE 'PTD-OPA-002' IN e.patterns
  RETURN p
revision: 3
resources:
  - https://github.com/saluc28/petard/blob/main/taxonomy-registry/opa/PTD-OPA-002-deny-undefined-on-missing-data.yaml
acknowledgements: []
