name: "PTD-OPA-006: escalations through a write another decision allows"
guid: 4c3c57e0-00c0-408e-ad94-ec75df67e189
prebuilt: false
platforms:
  - Open Policy Agent
category: A grant split across two decisions
description: >
  A decision lets the principal write a value that a second decision grants on, and a principal who
  holds that value today is where the write leads.
query: |-
  MATCH p = (:PTD_Principal)-[e:PTD_CanEscalateTo]->(:PTD_Principal)
  WHERE 'PTD-OPA-006' IN e.patterns
  RETURN p
revision: 1
