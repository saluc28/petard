description: >
  The nodes of the directory joined by PTD_ActsAs to a principal of an application, and the
  permissions that principal can raise there by writing what the write model allows. A path that
  reaches the node in the directory carries on into the application along these edges.
query: |-
  MATCH p = ()-[:PTD_ActsAs]->(:PTD_Principal)-[:PTD_CanEscalateTo]->(:PTD_Resource)
  RETURN p
