schemaFile: schema.zed
relationships: |-
  // The planner may audit the deploy tool but not call it. Each principal is
  // named by the object id of its workload identity in the directory.
  tool:deploy#observer@user:11111111-1111-1111-1111-111111111111
  // The release session may call the deploy tool, and the releaser is a member.
  agentsession:release#member@user:22222222-2222-2222-2222-222222222222
  tool:deploy#caller@agentsession:release#member
assertions:
  assertTrue:
    - tool:deploy#audit@user:11111111-1111-1111-1111-111111111111
    - tool:deploy#invoke@user:22222222-2222-2222-2222-222222222222
  assertFalse:
    - tool:deploy#invoke@user:11111111-1111-1111-1111-111111111111
