schema_version: 1

id: PTD-OPA-007
name: every-over-empty-domain
title: A check written with every stops applying when its domain is empty
closes: >
  Requiring at least one element before the every closes it.
engine: opa
status: verified

category:
  id: FAIL-OPEN-ON-ABSENCE
  title: Fail-open on absence
  summary: >
    A security check stops applying, not because somebody switched it off, but because the data
    it rests on is not there. The logic is right; its domain of application is smaller than it
    looks, and the difference is invisible in the code.
    Abstract category: it holds for any engine where the absence of a piece of data produces the
    absence of a decision instead of an error.
  category_note: >
    The third OPA instance of this category, and the cause is disjoint from the other two.
    `PTD-OPA-002` is a key missing from the data; `PTD-OPA-005` is an answer missing from the
    network; here the collection is present and simply empty, and `every` over an empty collection
    is true. The signals do not overlap: 002 finds a `data` reference that is undefined for some
    keys, 005 finds a network builtin whose error is not consumed, and this finds the `every`
    construct itself in a granting position over a domain that can be empty.

summary: >
  A decision approves when `every` element of a collection satisfies a condition. When the
  collection is empty the quantifier is vacuously true, so the decision grants with nothing
  checked. The check reads as strict, and it is, right up until there is nothing to be strict
  about.
  In the fixture, a merge is approved when every reviewer has approved. With no reviewers the
  merge goes through, reviewed by nobody.

preconditions:
  - capability: The principal can bring the decision a request whose collection is empty
    note: >
      In the fixture, a merge request with no reviews attached. No privilege is needed: an empty
      list is the natural state of a request nobody has acted on yet.

mechanism:
  description: >
    `every x in xs { cond }` holds when no element of `xs` breaks `cond`, and an empty `xs` breaks
    nothing, so the quantifier is true. Placed where its truth grants, the decision then grants on
    the empty case. The defect is not in the condition, which is correct, but in the silent
    assumption that the collection is never empty, and that assumption lives nowhere in the code.
  example: |
    package example

    # the decision the PEP of POST /changes/{id}/merge consumes
    default allow := false

    allow if {
        input.action == "merge"
        every review in input.reviews {
            review.approved
        }
    }
  example_note: >
    With `input.reviews` a list holding one unapproved review, `allow` is false; with the list
    empty, `allow` is true. Verified with opa 1.21.1. The guarded form, with
    `count(input.reviews) > 0` before the `every`, denies the empty case, and that is the counter
    case: the same quantifier over the same domain, told apart only by the guard.

detection:
  ast_source: compiled
  requires:
    - rule-graph
    - binding-resolution
  requires_note: >
    It does not require `concrete-data`, like `PTD-OPA-005` and unlike `PTD-OPA-002`. The defect
    is structural: an `every` in a granting position over a domain that can be empty is fail-open
    whatever the snapshot holds, because the request decides whether the domain is empty. Signal
    5 asks the decision, and a decision that reads documents is asked only when they are given:
    without them the match stays as the body reads it.
  signals:
    - order: 1
      check: >
        In the compiled body of a rule an entrypoint reaches there is an `every` expression,
        which the AST carries as an `ast.Every` term rather than as an ordinary call.
      rationale: >
        The quantifier is the construct at fault, so it is what the walk looks for. It is a node
        of its own in the compiled tree, which is why the pattern reads the compiled form.
    - order: 2
      check: >
        The rule sits on the side that grants: reached from the entrypoint with a parity of
        negations such that the body being true lets the request through, by making the decision
        hold or, for one declared to deny, by keeping it from holding. An `every` whose vacuous
        truth denies is fail-closed and is not reported.
      rationale: >
        This is the parity signal of `PTD-OPA-002` put to the opposite question. There the
        fail-open is missing data on the denying side; here it is a vacuous truth on the granting
        side. It inherits the same weak point, that which side applies the check depends on the
        PEP, and here the `entrypoint` annotations declare it, and `-deny-entrypoint` declares a
        decision the PEP reads as a refusal.
    - order: 3
      check: >
        The domain of the `every`, the collection it iterates, derives from `input` or `data`
        through the local bindings, rather than being a literal that is never empty.
      rationale: >
        A quantifier over a literal non-empty collection cannot go vacuous, so it is not a defect.
        The domain has to be something the request or the data can make empty, which is what makes
        the emptiness reachable rather than hypothetical.
    - order: 4
      check: >
        No `count` of the domain in the same body forces it non-empty first, as in
        `count(input.reviews) > 0`.
      rationale: >
        A guard that requires at least one element closes the hole, so the guarded form is the
        counter case and must not be reported. Only a `count` of the domain is recognized by
        reading the body. A guard written another way is left to signal 5.
    - order: 5
      check: >
        The decision says something different, for some request, because the `every` holds over an
        empty domain. It is asked twice with the domain empty, of the policy as it is and of a copy
        where the `every` has an iteration of its domain written before it, and what is left of
        the decision is compared, the value it answers with included. Where the two are the same
        the match is dropped. A decision that holds more than one `every` over the same domain is
        one match, compared with a copy for each way of choosing among them, and dropped when
        none differs. The domain is emptied in the request when it is a part of it named
        whole, and in the data when it is a document, one document at a time. A domain the policy
        computes is emptied by neither, and is asked with the whole request left open.
      rationale: >
        A guard is as often an iteration of the domain, a `some` that binds one of its elements or
        a count in another rule the decision also asks for, and a longer list of shapes to match
        stays fragile, because the `every` itself iterates the domain. Next to a guarded `every`
        another rule of the decision may grant anyway, and a decision may answer with a score or a
        report, defined either way. Comparing the decision with and without the vacuous truth
        depends on none of that. Two rules that each grant on it are told from the policy only by
        the copy that guards both, and an `every` whose guard would leave another rule to grant
        only by the copy that guards it alone, so every choice is compared. It is asked where the
        domain can be emptied: a domain under an element of a list of the request, a decision that
        reads documents when none were given, and more than four `every` over one domain in one
        decision are not asked, and stay as the body reads them.
  confidence: B
  confidence_note: >
    The construct and its domain are structural and would be worth more, but signal 2 rests on
    knowing which side applies the check, which depends on the PEP, the same weak point as 002 and
    005. The engine computes A on a bundle whose entrypoints are annotated or declared, because
    the granting side is then a known edge of the descent rather than a guess. The file stays at B
    because that is the level of the pattern when decisions have to be recognized. A bundle that
    annotates no entrypoint and is given none is that case: the decisions are inferred, the
    report says so, and the level printed on the finding stays A, so read such a finding at B.
  requires_write_model: false
  requires_write_model_note: >
    Not needed, for the same reason as 002 and 005: the defect is that a check does not apply, not
    that somebody wrote a value. A write model would say who can keep the collection empty on
    demand, which turns the finding into a route, but it is not needed for the finding itself.

graph:
  emits: finding
  marks:
    - kind: PTD_Rule
      properties: [empty_domains, is_decision]
  marks_note: >
    It does not emit `PTD_CanEscalateTo`: nobody reaches anybody, a check simply does not cover
    the empty case, which is a missing coverage like `PTD-OPA-002` and not a route. The pattern
    marks the rule that holds the `every`, with the collections it iterates in `empty_domains`.
    A rule that reads no document has no node otherwise, and the pattern adds it.

false_positives:
  - condition: >
      The domain cannot actually be empty in the deployment, because something upstream of OPA
      always fills it.
    discriminator: >
      Outside the policy and the data, so the engine cannot see it. It is the same shape as an
      intended absence in 002: declared in a note next to the decision, it stays in the report,
      because a guarantee nobody enforces in the bundle is only a convention.
    measurement: out-of-band
  - condition: >
      The `every` is a genuine business rule where the empty case is meant to pass, such as "no
      objection was raised".
    discriminator: >
      Intent is in no dataset. The guard is the signal: a decision that means the empty case to
      pass and a decision that forgot it look identical, and only a versioned list of accepted
      empty-passes tells them apart, kept next to the bundle as for the other patterns.
    measurement: out-of-band
  - condition: >
      The `every` is guarded against the empty case by something other than a count of the domain
      next to it: an iteration of the domain, a `some` that binds an element, or a count in
      another rule the decision also asks for.
    discriminator: >
      Signal 5. The body does not show such a guard where the every is, so the decision is asked
      with the domain empty, of the policy and of the copy where the every cannot be vacuous. It
      refuses in both, and the match is dropped.
    measurement: case
    case:
      policy: |
        package guarded_by_iteration

        # METADATA
        # scope: document
        # title: Merge approval, guarded by iterating the domain
        # entrypoint: true
        default allow := false

        allow if {
            input.reviews[_]
            every review in input.reviews {
                review.approved
            }
        }
      reports: false
      note: >
        `input.reviews[_]` is undefined for an empty list, so this decision denies the empty case
        exactly as the counter case in the fixture does, and the every behind it can never be
        vacuous. Run with opa 1.21.1: empty list `false`, one approved review `true`, one rejected
        `false`, no `reviews` key at all `false`. Signal 4 matches a `count` of the domain and
        nothing else, and signal 5 finds the decision the same with and without the vacuous truth:
        it refuses the empty list.
  - condition: >
      The `every` is guarded by something other than a count next to it, and another rule of the
      same decision grants whatever the domain holds.
    discriminator: >
      Signal 5. The decision holds with the domain empty through the other rule, in the policy and
      in the copy where the every cannot be vacuous alike. The vacuous truth changes nothing, and
      the match is dropped.
    measurement: case
    case:
      policy: |
        package guarded_on_one_way

        # METADATA
        # scope: document
        # title: Merge approval, with a way in for the release manager
        # entrypoint: true
        default allow := false

        allow if input.role == "release-manager"

        allow if {
            input.reviews[_]
            every review in input.reviews {
                review.approved
            }
        }
      reports: false
      note: >
        The second rule denies the empty list as the case above does, and the first grants the
        release manager whatever the reviews are. Run with opa 1.21.1: a developer with an empty
        list `false`, the release manager with an empty list `true`, by the first rule alone.
  - condition: >
      The `every` is guarded by something other than a count next to it, and the decision cannot
      be asked with the domain empty: the domain sits under an element of a list of the request,
      the decision reads documents and none were given, or it holds more than four `every` over
      that domain.
    discriminator: >
      Not told apart. An element of a list cannot be given an empty domain without saying what the
      rest of it holds, a document that was not given cannot be emptied, and past four `every` the
      copies to compare are more than are made, so the match stays as the body reads.
    measurement: case
    case:
      policy: |
        package guarded_domain_in_data

        # METADATA
        # scope: document
        # title: Merge approval, with the reviews kept in the data
        # entrypoint: true
        default allow := false

        allow if {
            data.reviews[input.change][_]
            every review in data.reviews[input.change] {
                review.approved
            }
        }
      reports: true
      note: >
        The iteration guards the every as in the first of these cases. The domain is the reviews of
        a change in the data, and the case gives no data, so there is no document to empty. With
        the documents given the question is asked, and the match is dropped.

not_a_lint_rule: >
  A linter sees the `every` in one file, but not whether it applies a check. Whether the rule
  grants or denies depends on how the PEP consumes it and on the negations between the entrypoint
  and the rule, which is the decision graph rather than one expression. `regal` v0.42.0 has no
  rule for it, confirmed by listing its rules at the source: the closest, `constant-condition` and
  `impossible-not`, are about expressions that are always true or always false in the file, not
  about a quantifier that goes true only when the request empties its domain.

fixture:
  bundle: fixtures/vulnerable-bundle/
  scenario: quill
  case: >
    `review.rego`, `allow_unguarded`: approve a merge when every reviewer approves. With no
    reviewers the merge is approved.
  counter_case: >
    `review.rego`, `allow_guarded`: the same every behind `count(input.reviews) > 0`, which denies
    the empty case.
  expected: >
    A finding on `data.quill.review.allow_unguarded`, and nothing on `allow_guarded`.

references:
  - title: regal, rule list at v0.42.0
    note: >
      open-policy-agent/regal at v0.42.0, the rule directories under bundle/regal/rules, checked on
      2026-09-14: no rule about `every` over an empty domain, and none about vacuous quantifiers.

verified:
  date: 2026-10-10
  tool_version: opa 1.21.1
  how: >
    The engine finds the case and stays quiet about the counter case on the fixture. The walk
    collects every `every` the decisions reach, resolving the domain through the locals the
    compiler lifts it into; on `allow_unguarded` the domain is `input.reviews`, unguarded and on
    the granting side, so the finding comes out, and on `allow_guarded` the same every is marked
    guarded by `count(input.reviews) > 0`, so nothing does.
    The numbers behind it, `data.quill.verify.empty_every`: `allow_unguarded` is true for the empty
    list and false once a reviewer rejects, while `allow_guarded` is false for the empty list. The
    quantifier itself was run with opa 1.21.1: `every` over an empty list is true.
    `regal` v0.42.0 reports no violations on `policy-v1`, and its rule list at that tag holds
    nothing for this construct.
    The five declared false positives are settled as the status requires. Two are `out-of-band`:
    a domain something upstream always fills, and an empty case that is meant to pass, both of
    them intent rather than policy. The other three carry a case that runs on every build. An
    every guarded by iterating its domain is told apart, alone and next to a rule that grants
    whatever the domain holds: with the domain empty the decision says the same whether or not
    the every can be vacuous, and nothing is reported. The same guard over a domain in the data,
    in a case that gives no data, is reported: that false positive is measured and not only
    declared.

related:
  - id: PTD-OPA-002
    note: >
      The same category, a disjoint cause. 002 is a key absent from the data; this is a collection
      present and empty. The parity signal is shared and asked the opposite way: 002 on the denying
      side, this on the granting side.
  - id: PTD-OPA-005
    note: >
      The same category again, and the closest in shape: both are structural rather than needing
      concrete data, and both rest on the enforcing side. 005 is an answer that never arrives from
      the network; this is a domain that is simply empty.
