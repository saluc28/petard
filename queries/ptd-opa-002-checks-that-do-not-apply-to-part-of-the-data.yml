name: "PTD-OPA-002: checks that do not apply to part of the data"
guid: 838629e1-0e9a-4432-bce5-a379a2256628
prebuilt: false
platforms:
  - Open Policy Agent
category: Fail-open on absence
description: >
  Reads on the side of a decision that denies, of a path some documents do not have: for those
  documents the check produces nothing and the request goes through.
query: |-
  MATCH p = (:PTD_Rule)-[e:PTD_Reads]->(:PTD_Attribute)
  WHERE 'PTD-OPA-002' IN e.patterns
  RETURN p
