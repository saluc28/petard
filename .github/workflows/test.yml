name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum declared in go.mod has to be tested: it is the version
        # that decides whether the compatibility claim is true. It is not a
        # choice, it is the higher of the floors of OPA and SpiceDB, and it
        # moves when they move. stable is what most people will actually be on.
        go: ["1.26", "stable"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      # A go.mod or go.sum that tidy would change is a dependency somebody added
      # without recording it, and the next person to run tidy gets it in a diff
      # that has nothing to do with their change.
      - name: Check the module files are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # Formatting is not checked here. gofmt's output changes between Go
      # releases, so the same file can be formatted for one version of the
      # matrix and unformatted for another, and the check fails on a file
      # nobody can write correctly. The Lint workflow runs it once, on one
      # version.
      - name: Build
        run: go build ./...

      # -race catches data races, -shuffle=on catches tests that only pass in
      # the order they were written.
      - name: Test
        run: go test -race -shuffle=on -coverprofile=coverage.out ./...

      - name: Coverage summary
        if: matrix.go == 'stable'
        run: go tool cover -func=coverage.out | tail -n 1

  oracle:
    name: Engine against SpiceDB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      # zed validate is SpiceDB's own checker. The engine answers every check
      # the objects of a validation file allow, the answers are written as
      # assertions, and zed says whether SpiceDB gives the same ones. The
      # version is pinned, and the archive is checked against the checksum the
      # release publishes.
      - name: Install zed
        run: |
          curl -sSfL -o zed.tar.gz https://github.com/authzed/zed/releases/download/v1.2.1/zed_1.2.1_linux_amd64_gnu.tar.gz
          echo "600dbe497ddabb26372aeb69b7a15ff8624a41925f1e47146177132635f4b752  zed.tar.gz" | sha256sum --check
          tar -xzf zed.tar.gz zed

      # It runs over the validation files of testdata and over the integration
      # test configs SpiceDB ships in the module petard already requires.
      - name: Hold the engine against SpiceDB
        run: |
          go mod download github.com/authzed/spicedb
          export PETARD_ZED="$PWD/zed"
          export PETARD_ZANZIBAR_CORPUS="$(go list -m -f '{{.Dir}}' github.com/authzed/spicedb)/internal/services/integrationtesting/testconfigs"
          go test -run TestOracle -v ./internal/zanzibar/spicedb
