name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A weekly run catches vulnerabilities disclosed after the last commit.
    # This one has dependencies, so the findings can come from anywhere in the
    # tree and not only from the standard library.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write
  # For the workflow-run endpoint CodeQL reads to send its status report. A
  # private repository does not grant it by default, and without it the log
  # carries a "Resource not accessible by integration" warning that is easy to
  # mistake for the cause of a failure. It is not one: see the note on the jobs.
  actions: read

# The gosec and CodeQL jobs both end by uploading SARIF to code scanning, which
# GitHub provides free on public repositories and, on private ones, only with
# Advanced Security. On a private repository the analysis runs, succeeds, and
# then fails at the upload with "Code scanning is not enabled for this
# repository", which reads like a broken workflow rather than a missing feature.
# So both skip unless the repository is public. When the visibility cannot be
# read from the event payload they run anyway, because being public is the case
# that matters. govulncheck uploads nothing and always runs.
jobs:
  govulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: govulncheck
        uses: golang/govulncheck-action@v1

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    if: github.event.repository.private != true

    steps:
      - uses: actions/checkout@v7

      # gosec loads packages through the go command, and when that cannot load
      # the module gosec checks nothing, writes an empty SARIF and exits zero. Its
      # action runs in an image with a Go of its own and GOTOOLCHAIN=local, so a
      # go.mod newer than that Go leaves it looking at nothing. Here it runs under
      # the Go go.mod names.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # This reads files whose paths somebody else chose and builds
      # authenticated HTTP requests to an instance somebody else runs, so a SAST
      # pass over the file and network code earns its slot here.
      # Pinned to a patch version, which moves by hand: Dependabot does not read
      # a go run.
      # The exclusions are the ones .golangci.yml already carries, with the
      # reasoning written there. gosec does not read that file, and without them
      # the Security tab fills with twelve findings this repository does not
      # treat as defects, which is how a tab becomes one nobody opens. G104 is
      # errcheck's beat anyway, and errcheck runs over the whole tree in the
      # lint workflow with a rule gosec cannot express.
      # The SARIF goes to code scanning, and the same results as JSON to the next
      # step.
      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -no-fail -exclude=G104,G304,G404 -fmt sarif -out gosec-results.sarif -stdout -verbose json ./... > gosec-results.json

      # -no-fail keeps findings out of the job's result, and a run that checked
      # nothing looks the same. This fails when no file was checked, or when a file
      # lost its types, which silences the rules that need them.
      - name: Check that gosec read the code
        run: jq -e '.Stats.files > 0 and ((."Golang errors" // {}) | length == 0)' gosec-results.json

      - name: Upload gosec results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec-results.sarif

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    if: github.event.repository.private != true

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          config-file: .github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
