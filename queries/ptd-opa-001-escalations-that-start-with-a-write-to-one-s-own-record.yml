name: "PTD-OPA-001: escalations that start with a write to one's own record"
guid: 3dd11449-b212-49d0-a00c-6a41219c2504
prebuilt: false
platforms:
  - Open Policy Agent
category: Attribute self-write
description: >
  The escalations the chain with PTD-OPA-003 draws: the principal writes a field of their own record
  and reaches the position of another. via_write_path names the write.
query: |-
  MATCH p = (:PTD_Principal)-[e:PTD_CanEscalateTo]->(:PTD_Principal)
  WHERE 'PTD-OPA-003' IN e.patterns
  RETURN p
revision: 1
